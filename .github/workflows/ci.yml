name: Tests

# On demand only: run after a merge and Vercel deploy when Daniel asks.
on:
  workflow_dispatch:
    inputs:
      unit:
        description: Unit tests (Vitest)
        type: boolean
        default: true
      e2e:
        description: End-to-end tests (Playwright, android/iphone/desktop + axe)
        type: boolean
        default: true
      lighthouse:
        description: Lighthouse CI (performance, accessibility, JS budget)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  unit:
    if: inputs.unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    if: inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    if: inputs.lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Uses the runner's preinstalled Chrome.
      - run: pnpm lhci
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          # The directory is hidden; upload-artifact skips those by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
