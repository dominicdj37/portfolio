name: update-snapshots

# Daniel-only (Sprint 0 Q3; site v1 AC16): regenerates the Linux visual
# baselines for a PR branch and commits them there. Agents never run this,
# and the protect-paths hook blocks local baseline writes.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: PR branch to update (never main)
        required: true
        type: string

permissions:
  contents: write
  actions: write

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  update:
    if: inputs.branch != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build
      - run: pnpm exec playwright test tests/e2e/visual.spec.ts --update-snapshots
      - name: Commit the baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test: update visual baselines (update-snapshots)"
            git push origin HEAD:${{ inputs.branch }}
          fi
      # Pushes made with GITHUB_TOKEN don't trigger workflows, so start CI on
      # the branch explicitly; its checks attach to the new head commit.
      - name: Re-run CI on the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref ${{ inputs.branch }}
