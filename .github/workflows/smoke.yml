name: Production smoke

# S10: after Vercel reports a successful production deploy, check the live site.
# Vercel reports deploys as a commit status (context "Vercel"), not as GitHub
# Deployments, so `deployment_status` never fires here. A successful status on
# a commit that's on main is a production deploy. Deployment URLs are behind
# Vercel Deployment Protection, so the event is only the trigger: the test runs
# against the public production domain below.
on:
  status:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL to check (defaults to the production domain)
        required: false

permissions:
  contents: read

env:
  # Update when the custom domain lands (Phase 5, plan P6).
  PRODUCTION_URL: https://portfolio-mu-inky-3anc9yn1ky.vercel.app

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' &&
       github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    # On the job, not the workflow: every PR's Vercel status also starts a run,
    # and only runs that pass the `if` above should join (and cancel) the group.
    concurrency:
      group: smoke-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke
        env:
          BASE_URL: ${{ inputs.base_url || env.PRODUCTION_URL }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14
