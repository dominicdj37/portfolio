name: Production smoke

# On demand only: check the live site after a production deploy when Daniel asks.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL to check (defaults to the production domain)
        required: false

permissions:
  contents: read

env:
  # Update when the custom domain lands (Phase 5, plan P6).
  PRODUCTION_URL: https://portfolio-mu-inky-3anc9yn1ky.vercel.app

jobs:
  smoke:
    concurrency:
      group: smoke-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke
        env:
          BASE_URL: ${{ inputs.base_url || env.PRODUCTION_URL }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14
